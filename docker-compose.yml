services:
  ai-driver:
    image: adityyaa/self-driving-car:agent  # remove this line to force a local build
    build: .
    ports:
      - "127.0.0.1:4567:4567"  # loopback only: the simulator runs on the same machine
    environment:
      - LLM_API_KEY  # optional OpenRouter key (from your shell or a .env file): turns on the vision LLM
    volumes:
      - ./stuck_frames:/app/stuck_frames  # camera frames the recovery agent judged
